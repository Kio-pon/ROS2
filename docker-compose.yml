# =============================================================================
#  PX4 + ROS 2 Jazzy + Gazebo Harmonic — NATIVE-display drone simulator
# =============================================================================
#  GUI windows (Gazebo, Mission Control, rviz) render on YOUR screen — no
#  browser, no VNC. Real GPU acceleration via the host driver.
#
#  Quick start (Linux host):
#     xhost +local:root                              # allow the container to use your X server (once per login)
#     UID=$(id -u) GID=$(id -g) docker compose build # first build compiles PX4 (~10-20 min)
#     docker compose up -d
#     docker compose exec drone-sim ~/launchers/run_all.sh
#
#  NVIDIA GPU? Add the override so it gets full acceleration:
#     docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
#  Headless (CI / automated tests, no screen):
#     docker compose run --rm -e HEADLESS=1 drone-sim ~/launchers/run_headless_drone.sh
#
#  Defaults (UID/GID, PX4 commit, drone model…) live in .env — edit there.
# =============================================================================

services:
  drone-sim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PX4_REF: ${PX4_REF:-183b3e38d5}
        PX4MSGS_REF: ${PX4MSGS_REF:-64775a2}
        JOBS: ${BUILD_JOBS:-6}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: px4-drone-sim:latest
    container_name: px4-drone-sim

    # ── Resource allocation — give the container the full machine ──────────
    cpus: "8"               # allow all 8 host cores
    cpuset: "0-7"           # pin to all cores (prevents scheduler bouncing)
    mem_limit: 14g          # cap at 14 GB — leaves ~2 GB for host OS
    memswap_limit: 18g      # allows 4 GB swap headroom if RAM spikes
    shm_size: "2g"          # shared-memory for Gazebo/DDS (default 64 MB is too small)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536         # raise open-file limit for Gazebo + DDS topics
      stack:
        soft: -1
        hard: -1            # unlimited stack — needed by PX4 posix platform

    # Host networking = zero-config ROS 2 DDS discovery, Gazebo transport,
    # and the XRCE-DDS UDP link. IPC host = fast shared-memory for DDS.
    network_mode: host
    ipc: host
    pid: host               # share host PID namespace — lets nice/renice work from host
    init: true            # reap the many child processes PX4/Gazebo spawn

    environment:
      # --- Native display ---------------------------------------------------
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-student
      # Set HEADLESS=1 to run Gazebo with no GUI (automated testing).
      - HEADLESS=${HEADLESS:-}
      # --- ROS 2 ------------------------------------------------------------
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # --- DRONE / WORLD SELECTION (change the airframe here) ---------------
      #   x500 + mono camera (default) : 4010 / gz_x500_mono_cam
      #   plain x500 (no camera)       : 4001 / gz_x500
      #   x500 + depth camera          : 4002 / gz_x500_depth
      #   x500 + gimbal camera         : 4019 / gz_x500_gimbal
      #   standard VTOL                : 4004 / gz_standard_vtol
      - PX4_SYS_AUTOSTART=${PX4_SYS_AUTOSTART:-4010}
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500_mono_cam}
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-forest}

    volumes:
      # Native X11 socket — this is what puts windows on your screen.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Live-edit your code on the host; rebuild with colcon inside the container.
      - ./drone_controller:/home/student/px4_ros2_ws/src/drone_controller
      - /home/administrator/Downloads:/home/student/Downloads
      # --- Extensibility: drop assets here, no rebuild needed ---------------
      - ./custom_models:/home/student/custom_models       # custom Gazebo SDF models
      - ./custom_worlds:/home/student/custom_worlds       # custom .sdf worlds
      - ./custom_airframes:/home/student/custom_airframes  # custom PX4 airframe configs
      - ./missions:/home/student/missions                  # saved Mission Control plans (JSON)
      # Launcher scripts — bind-mounted so host edits reflect in the container instantly
      - ./gen_forest.py:/home/student/launchers/gen_forest.py
      - ./gen_farmland.py:/home/student/launchers/gen_farmland.py
      - ./gen_row_crops.py:/home/student/launchers/gen_row_crops.py
      - ./gen_wheat_field.py:/home/student/launchers/gen_wheat_field.py
      - ./launcher_gui.py:/home/student/launchers/launcher_gui.py
      - ./place_on_terrain.py:/home/student/launchers/place_on_terrain.py
      - ./run_all.sh:/home/student/launchers/run_all.sh
      - ./custom_models:/home/student/custom_models
      - ./custom_worlds:/home/student/custom_worlds
      - ./bridge.yaml:/home/student/launchers/bridge.yaml

    # Intel/AMD GPU + software rendering go through /dev/dri.
    # (NVIDIA uses the toolkit instead — see docker-compose.nvidia.yml.)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
      - "992"

    stdin_open: true
    tty: true
